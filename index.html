<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XAUUSD 风险参考计算器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 16px;
            color: #2c3e50;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        h2 {
            margin: 0 0 12px 0;
            font-size: 18px;
            display: flex;
            align-items: center;
        }
        .input-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 4px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .row {
            display: flex;
            gap: 8px;
        }
        .row .input-group {
            flex: 1;
        }
        .result-highlight {
            background: #f0f7ff;
            border-left: 4px solid #409eff;
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0;
            font-size: 14px;
        }
        .stat-table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0;
        }
        .stat-table td {
            padding: 6px 4px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }
        .stat-table td:first-child {
            color: #7f8c8d;
            width: 40%;
        }
        .stat-table td:last-child {
            font-weight: 600;
        }
        .disclaimer {
            font-size: 11px;
            color: #95a5a6;
            margin-top: 16px;
            line-height: 1.5;
            border-top: 1px solid #eee;
            padding-top: 12px;
        }
        .btn {
            background: #409eff;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            width: 100%;
            cursor: pointer;
        }
        .zone-box {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
            margin: 8px 0;
        }
        .zone-box .dir-title {
            font-weight: 600;
            margin-bottom: 6px;
        }
        .zone-box .level {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin: 4px 0;
        }
        .stop { color: #e74c3c; }
        .take { color: #27ae60; }
    </style>
</head>
<body>

<div class="card">
    <h2>🧮 XAUUSD 风险参考计算器</h2>

    <div class="input-group">
        <label>当前参考价格 (中间价)</label>
        <input type="number" id="currentPrice" step="0.01" placeholder="例如 1925.30">
    </div>

    <div class="row">
        <div class="input-group">
            <label>近期平均真实波幅 (ATR, 美元)</label>
            <input type="number" id="atr" step="0.1" placeholder="例如 2.5">
        </div>
        <div class="input-group">
            <label>ATR 统计倍数 (波动区间)</label>
            <select id="atrMultiplier">
                <option value="1">1倍 (约68%概率)</option>
                <option value="1.5" selected>1.5倍</option>
                <option value="2">2倍 (约95%概率)</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div class="input-group">
            <label>您的本金 (美元)</label>
            <input type="number" id="capital" placeholder="例如 500">
        </div>
        <div class="input-group">
            <label>计划风险比例 (%)</label>
            <select id="riskPercent">
                <option value="0.5">0.5% (保守)</option>
                <option value="1" selected>1%</option>
                <option value="2">2% (激进)</option>
            </select>
        </div>
    </div>

    <div class="input-group">
        <label>杠杆倍数</label>
        <input type="number" id="leverage" value="1000" step="100">
    </div>

    <button class="btn" onclick="calculate()">计算参考手数、波动区间与止盈止损</button>

    <div id="result" style="display:none; margin-top:16px;">
        <div class="result-highlight">
            <strong>📊 计算结果</strong>
            <div id="resultContent"></div>
        </div>
        <div class="disclaimer">
            ⚠️ <strong>重要声明</strong>：本工具仅基于您输入的参数进行纯数学估算，<strong>不构成任何投资建议或交易指令</strong>。
            所有边界值均为统计概率参考，实际市场可能出现远超该范围的波动。交易决策与风险由您自主独立承担。
        </div>
    </div>
</div>

<script>
    // 从URL参数预填充
    function getQueryParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    window.onload = function() {
        const price = getQueryParam('price');
        const atr = getQueryParam('atr');
        const pair = getQueryParam('pair');
        if (price) document.getElementById('currentPrice').value = price;
        if (atr) document.getElementById('atr').value = atr;
        if (pair === 'XAUUSD') {
            document.title = 'XAUUSD 风险参考计算器';
        }
        // 默认填入示例数据
        if (!price) document.getElementById('currentPrice').value = 1925.30;
        if (!atr) document.getElementById('atr').value = 2.5;
    };

    function formatNumber(num, decimals = 2) {
        return num.toFixed(decimals);
    }

    function calculate() {
        const price = parseFloat(document.getElementById('currentPrice').value);
        const atr = parseFloat(document.getElementById('atr').value);
        const mult = parseFloat(document.getElementById('atrMultiplier').value);
        const capital = parseFloat(document.getElementById('capital').value);
        const riskPct = parseFloat(document.getElementById('riskPercent').value) / 100;
        const leverage = parseFloat(document.getElementById('leverage').value);

        if (isNaN(price) || isNaN(atr) || isNaN(capital) || capital <= 0 || leverage <= 0) {
            alert('请填写所有必填字段');
            return;
        }

        // ----- 1. 波动区间（原有功能） -----
        const lowerBound = price - atr * mult;
        const upperBound = price + atr * mult;
        const riskDistance = price - lowerBound;
        const rewardDistance = upperBound - price;

        // ----- 2. 仓位估算（原有逻辑） -----
        const maxLossAmount = capital * riskPct;
        const lotsStd = maxLossAmount / (riskDistance * 100);
        const lotsMini = lotsStd * 10;
        const lotsMicro = lotsStd * 100;

        // ----- 3. 止盈止损参考（新增） -----
        // 默认倍数：止损1.5 ATR，止盈2.5 ATR，可根据需要调整
        const stopMult = 1.5;
        const tpMult = 2.5;

        // 做多
        const longStop = price - stopMult * atr;
        const longTake = price + tpMult * atr;
        // 做空
        const shortStop = price + stopMult * atr;
        const shortTake = price - tpMult * atr;

        // 构建结果HTML
        let html = `
            <table class="stat-table">
                <tr><td>参考下侧边界</td><td style="color:#e74c3c;">${formatNumber(lowerBound)} 美元</td></tr>
                <tr><td>参考上侧边界</td><td style="color:#27ae60;">${formatNumber(upperBound)} 美元</td></tr>
                <tr><td>下侧统计距离</td><td>${formatNumber(riskDistance)} 美元</td></tr>
                <tr><td>上侧统计距离</td><td>${formatNumber(rewardDistance)} 美元</td></tr>
                <tr style="border-top:2px solid #ddd;"><td>账户可承担最大亏损</td><td>${formatNumber(maxLossAmount)} 美元</td></tr>
                <tr><td>参考手数 (标准手)</td><td>${formatNumber(lotsStd, 3)} 手</td></tr>
                <tr><td>参考手数 (迷你手 0.1)</td><td>${formatNumber(lotsMini, 2)} 手</td></tr>
                <tr><td>参考手数 (微型手 0.01)</td><td>${formatNumber(lotsMicro, 1)} 手</td></tr>
                <tr><td>每0.01手价值</td><td>0.01美元/点 (0.01美元波动)</td></tr>
            </table>
            <div class="zone-box">
                <div class="dir-title">📈 做多参考</div>
                <div class="level"><span>止损参考 (${stopMult}×ATR)</span><span class="stop">${formatNumber(longStop)} 美元</span></div>
                <div class="level"><span>止盈参考 (${tpMult}×ATR)</span><span class="take">${formatNumber(longTake)} 美元</span></div>
            </div>
            <div class="zone-box">
                <div class="dir-title">📉 做空参考</div>
                <div class="level"><span>止损参考 (${stopMult}×ATR)</span><span class="stop">${formatNumber(shortStop)} 美元</span></div>
                <div class="level"><span>止盈参考 (${tpMult}×ATR)</span><span class="take">${formatNumber(shortTake)} 美元</span></div>
            </div>
            <p style="font-size:12px; color:#7f8c8d; margin:8px 0 0 0;">
                * 止盈止损基于默认参数（止损1.5倍ATR，止盈2.5倍ATR），仅供参考，请根据个人策略调整。
            </p>
        `;
        document.getElementById('resultContent').innerHTML = html;
        document.getElementById('result').style.display = 'block';
    }
</script>

</body>
</html>
